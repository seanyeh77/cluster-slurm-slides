<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster 與 Slurm 簡報</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Values of the ui-design-system "teaching" preset */
  :root { --bg:#fcfbfb; --surface:#ffffff; --ink:#171512; --mut:#6d645a; --teal:#0f766e; --line:#e2dfdc; --soft:#e2efee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Noto Sans TC", sans-serif; font-size: 16px; line-height: 1.65; }
  .bar { height: 6px; background: var(--teal); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin: 0 0 8px; }
  h1 { font-size: 31px; line-height: 1.3; font-weight: 700; margin: 0 0 32px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  a.deck { display: grid; grid-template-columns: auto 1fr; column-gap: 20px; padding: 20px 24px; background: var(--surface); border: 1.5px solid var(--line); color: inherit; text-decoration: none; transition: border-color .15s; }
  a.deck:hover, a.deck:focus-visible { border-color: var(--teal); outline: none; }
  .n { grid-row: span 2; font-size: 25px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
  .t { font-size: 20px; font-weight: 700; }
  .d { color: var(--mut); }
  p.more { margin: 32px 0 0; color: var(--mut); }
  p.more a { color: var(--teal); font-weight: 600; }
  @media (max-width: 600px) { main { padding: 32px 16px 48px; } h1 { font-size: 25px; } }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <p class="label">Slides</p>
  <h1>Cluster 與 Slurm</h1>
  <ol>
    <li><a class="deck" href="intro/"><span class="n">01</span><span class="t">Introduction to Cluster</span><span class="d">Cluster 的架構、Shared File System 與 Workload Manager，以 Slurm 送出第一個 job。</span></a></li>
    <li><a class="deck" href="build/"><span class="n">02</span><span class="t">Building and Installing Slurm</span><span class="d">建置前的同步、從原始碼安裝、最小設定，以及正式環境的備援與 partition 規劃。</span></a></li>
  </ol>
  <p class="more">Introduction to Cluster 的指令清單：<a href="commands.html">commands.html</a></p>
</main>
</body>
</html>
