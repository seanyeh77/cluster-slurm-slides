<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cluster 與 Slurm 動畫</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #20262e;
        --muted: #66707c;
        --rule: #e2e5e9;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fff;
        color: var(--ink);
        font: 15px/1.5 Inter, "Noto Sans TC", system-ui, sans-serif;
      }
      #stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        cursor: pointer;
        min-height: 0;
      }
      #stage canvas {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-top: 1.5px solid var(--rule);
      }
      button {
        font: inherit;
        padding: 6px 16px;
        border: 1.5px solid var(--ink);
        background: #fff;
        color: var(--ink);
        border-radius: 0;
        cursor: pointer;
      }
      button:disabled { opacity: 0.35; cursor: default; }
      #step {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .hint { margin-left: auto; color: var(--muted); }
      /* 嵌入模式（?embed=1）：只留畫布，填滿 iframe，由外層控制 */
      body.embed footer { display: none; }
      body.embed #stage { padding: 0; cursor: default; }
      body.embed #stage canvas { width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <footer>
      <button id="prev">上一步</button>
      <button id="next">下一步</button>
      <button id="replay">重播</button>
      <span id="step">1 / 1</span>
      <span class="hint">方向鍵前後移動，R 重播這一段，F 全螢幕</span>
    </footer>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
